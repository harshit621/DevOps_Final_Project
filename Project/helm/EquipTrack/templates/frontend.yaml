apiVersion: apps/v1
kind: Deployment
metadata:
  name: equiptrack-frontend
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: equiptrack-frontend
  template:
    metadata:
      labels:
        app: equiptrack-frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image }}:{{ .Values.frontend.tag }}"
          ports:
            - containerPort: {{ .Values.frontend.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: equiptrack-frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080